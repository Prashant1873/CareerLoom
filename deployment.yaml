# ==============================================================================
# CareerLoom Kubernetes Production Deployment Manifest
# Complete Multi-Tier Infrastructure: Backend, Frontend, Storage, Ingress & Cron
# ==============================================================================

apiVersion: v1
kind: Namespace
metadata:
  name: careerloom
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: careerloom-config
  namespace: careerloom
data:
  APP_ENV: "production"
  PORT: "8000"
  LOG_LEVEL: "INFO"
---
apiVersion: v1
kind: Secret
metadata:
  name: careerloom-secrets
  namespace: careerloom
type: Opaque
stringData:
  GROQ_API_KEY: ""
  GEMINI_API_KEY: ""
  OPENROUTER_API_KEY: ""
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: careerloom-data-pvc
  namespace: careerloom
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
# ==============================================================================
# Backend Deployment & Service
# ==============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: careerloom-backend
  namespace: careerloom
  labels:
    app: careerloom
    tier: backend
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: careerloom
      tier: backend
  template:
    metadata:
      labels:
        app: careerloom
        tier: backend
    spec:
      containers:
        - name: backend
          image: ghcr.io/prashant1873/careerloom-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: careerloom-config
            - secretRef:
                name: careerloom-secrets
          volumeMounts:
            - name: persistent-storage
              mountPath: /app/backend/data
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1024Mi"
          readinessProbe:
            httpGet:
              path: /api/jobs/stats
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/jobs/stats
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 5
      volumes:
        - name: persistent-storage
          persistentVolumeClaim:
            claimName: careerloom-data-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: careerloom
  labels:
    app: careerloom
    tier: backend
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
      name: http
  selector:
    app: careerloom
    tier: backend
---
# ==============================================================================
# Frontend Deployment & Service
# ==============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: careerloom-frontend
  namespace: careerloom
  labels:
    app: careerloom
    tier: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: careerloom
      tier: frontend
  template:
    metadata:
      labels:
        app: careerloom
        tier: frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/prashant1873/careerloom-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: careerloom
  labels:
    app: careerloom
    tier: frontend
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
      name: http
  selector:
    app: careerloom
    tier: frontend
---
# ==============================================================================
# Ingress Controller (Unified Gateway)
# ==============================================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: careerloom-ingress
  namespace: careerloom
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/proxy-body-size: "20m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
spec:
  tls:
    - hosts:
        - careerloom.app
      secretName: careerloom-tls-cert
  rules:
    - host: careerloom.app
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
---
# ==============================================================================
# Daily Automated ATS & Unicorn Scraping CronJob
# ==============================================================================
apiVersion: batch/v1
kind: CronJob
metadata:
  name: careerloom-daily-sync
  namespace: careerloom
spec:
  schedule: "0 2 * * *" # Daily at 02:00 AM UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: sync-runner
              image: ghcr.io/prashant1873/careerloom-backend:latest
              command: ["python", "-m", "backend.scripts.run_discovery"]
              envFrom:
                - configMapRef:
                    name: careerloom-config
                - secretRef:
                    name: careerloom-secrets
              volumeMounts:
                - name: persistent-storage
                  mountPath: /app/backend/data
          volumes:
            - name: persistent-storage
              persistentVolumeClaim:
                claimName: careerloom-data-pvc
